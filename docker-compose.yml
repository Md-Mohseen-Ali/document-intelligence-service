services:
  postgres:
    image: postgres:16
    container_name: document-intelligence-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: document_intelligence
      POSTGRES_USER: app_user
      POSTGRES_PASSWORD: app_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7
    container_name: document-intelligence-redis
    restart: unless-stopped
    ports:
      - "6379:6379"

volumes:
  postgres_data: